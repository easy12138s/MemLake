# Mem Lake Docker Compose 编排
# 三容器：PostgreSQL（AGE+pgvector+zhparser）、Embedding 服务、Mem Lake 应用

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.pg
    environment:
      POSTGRES_USER: memlake
      POSTGRES_PASSWORD: memlake
      POSTGRES_DB: memlake
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U memlake"]
      interval: 10s
      timeout: 5s
      retries: 5

  embedding:
    build:
      context: .
      dockerfile: Dockerfile.embedding
      args:
        DOWNLOAD_MODEL: ${DOWNLOAD_MODEL:-true}
        DOWNLOAD_RERANK_MODEL: ${DOWNLOAD_RERANK_MODEL:-true}
    ports:
      - "8001:8001"
    environment:
      DEVICE: cpu
      # 精排模型路径（默认镜像内置 bge-reranker-base；留空则不加载精排）
      RERANK_MODEL_PATH: ${RERANK_MODEL_PATH:-/models/bge-reranker-base}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  mem-lake:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.app
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      embedding:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg_async://memlake:memlake@postgres:5432/memlake
      EMBEDDING_HOST: embedding
      EMBEDDING_PORT: "8001"
    env_file:
      - ../.env

volumes:
  pg_data:
