# 本地复用模型（可选叠加层）
#
# 适用场景：宿主机已下载过 Qwen3-Embedding-0.6B 模型，且希望将该目录
# 直接挂载进容器（跳过镜像内已内置的模型）。
#
# 注意：本仓库的 embedding 镜像在构建期已自动下载并内置模型
# （位于镜像内 /models/Qwen3-Embedding-0.6B），因此【默认无需叠加本文件】，
# 直接 `docker compose up -d` 即可，容器会使用镜像内置模型。
#
# 仅当你确实想用宿主机模型目录覆盖镜像内置模型时，才需要配置下面的挂载，
# 且必须保证宿主机路径真实存在且包含完整模型文件，否则容器会因加载不到
# 模型而启动失败。当前默认配置为不挂载（与基础 compose 行为一致）。

services:
  embedding:
    build:
      args:
        DOWNLOAD_MODEL: "true"
        DOWNLOAD_RERANK_MODEL: "true"

# 本机需求文档挂载（可选叠加层）：
# 宿主机 Axure 导出目录 → 容器 /data/reqs（容器重建不丢，免去手工 docker cp）。
# 真实路径经环境变量 REQS_HOST_DIR 注入（写入 deploy/.env，该文件不入库）。
# 使用：docker-compose -f docker-compose.yml -f docker-compose.local.yml up -d mem-lake
# 正式导入：memlake-import-requirements /data/reqs --system-code <code> --adapter axure
  mem-lake:
    volumes:
      - "${REQS_HOST_DIR:?请在 deploy/.env 中设置 REQS_HOST_DIR=需求文档目录}:/data/reqs:ro"
