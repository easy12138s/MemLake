[project]
name = "mem-lake"
version = "1.0.0"
description = "多智能体协作记忆基础设施"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mem Lake Team" }]

dependencies = [
    # MCP 网关（4.0 beta 启用 MCP 2026-07-28 无状态协议特性：server/discover、Mcp-Method 头、ttlMs/cacheScope）
    "fastmcp>=4.0.0b1",
    # ASGI 服务器（mcp.run http transport 依赖）
    "uvicorn[standard]>=0.30.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    # 向量检索
    "pgvector>=0.3.0",
    # HTTP 客户端（embedding client）
    "httpx>=0.27.0",
    # 工具库
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyyaml>=6.0",
    "bcrypt>=4.0.0",
    # 可观测性
    "prometheus-client>=0.20.0",
    "structlog>=24.0.0",
]

[project.optional-dependencies]
# sentence-transformers 仅 embedding 服务容器需要，app 容器通过 HTTP 调用 embedding 服务
embedding = [
    "sentence-transformers>=3.0.0",
]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[project.scripts]
memlake-bootstrap-admin = "mem_lake.cli:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mem_lake"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
