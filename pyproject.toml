[project]
name = "mem-lake"
version = "0.1.0"
description = "多智能体协作记忆基础设施"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Mem Lake Team" }]

dependencies = [
    # MCP 网关
    "fastmcp>=3.0.0",
    # 数据库
    "sqlalchemy[asyncio]>=2.0.0",
    "psycopg[binary,pool]>=3.2.0",
    # Apache AGE Python 驱动
    "age>=1.8.0",
    # 向量检索
    "pgvector>=0.3.0",
    # Embedding
    "sentence-transformers>=3.0.0",
    # 工具库
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "bcrypt>=4.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mem_lake"]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true
