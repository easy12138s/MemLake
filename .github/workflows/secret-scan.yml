name: Secret Scan

on:
  push:
    branches:
      - master
      - "release/**"
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan git history for secrets
        run: |
          docker run --rm \
            -v "$PWD:/repo" \
            zricethezav/gitleaks:latest \
            detect --source=/repo --config=/repo/.gitleaks.toml --redact --verbose

      - name: Reject non-anonymous commit emails
        run: |
          bad=$(git log --all --format='%ae' | sort -u | grep -Ev '@users\.noreply\.github\.com$|@memlake\.local$' || true)
          if [ -n "$bad" ]; then
            echo "提交历史中存在非匿名邮箱，请统一使用 GitHub noreply 邮箱："
            echo "$bad"
            exit 1
          fi
